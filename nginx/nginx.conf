upstream django {
    server web:8000;
}

server {
    listen 80;

    #server_name lynx-chess.com www.lynx-chess.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://lynx-chess.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/nginx/ssl/live/lynx-chess.com/lynx-chess.com.pem;
    ssl_certificate_key /etc/nginx/ssl/live/lynx-chess.com/lynx-chess.com.key;

    server_name lynx-chess.com;

    location / {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /home/app/web/staticfiles/;
    }

    location /media/ {
        alias /home/app/web/mediafiles/;
    }

    location /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /clientSubmitPGN/ {
        client_max_body_size 50M;

        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;

        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /api/pgns/ {
        proxy_buffers 8 16k;
        proxy_buffer_size 32k;

        proxy_max_temp_file_size 1024k;

        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;
    }
}